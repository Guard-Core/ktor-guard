name: Greetings

on: [pull_request_target, issues]

permissions: {}

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        issue_message: |
            Thanks for opening your first issue on **ktor-guard**!

            To help us triage quickly, please make sure your report includes:
            - A clear reproduction (a short Kotlin snippet or failing test is ideal)
            - Output of `./gradlew --version` (JDK 17 is the floor)
            - The framework version in use (Ktor 3.x is the target)
            - The guard-core engine version you depend on

            A few pointers:
            - Scan [README.md](../blob/master/README.md) for the adapter layout and its honest status (W0 scaffold: the adapter implementation lands in a later wave).
            - **Security vulnerability?** Do **not** open a public issue - please use GitHub's private vulnerability reporting.

            Thanks again - a maintainer will be with you soon.
        pr_message: |
            Thanks for opening your first pull request on **ktor-guard**!

            Quick checklist before review (most of these are enforced by CI, but worth a glance):
            - [ ] The PR body says `Closes #N` for an open issue (the `issue-link` check enforces it); chores take the `no-issue` label
            - [ ] `./gradlew spotlessCheck detekt` is clean
            - [ ] `./gradlew build` passes
            - [ ] No blanket `@Suppress` in non-test code

            See [README.md](../blob/master/README.md) for the adapter status. Welcome aboard - a maintainer will review shortly.
