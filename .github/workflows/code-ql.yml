name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions: {}

env:
  # The engine ref ktor-guard pins (mirrors ci.yml; settings.gradle.kts builds the engine
  # from source, so the composite build needs the sibling checkout during analysis).
  GUARD_CORE_JVM_REF: 77116062fc7d88dcb610b1f588e2bc78e63848ad

jobs:
  # One job for every language, so the required check context is exactly `code-ql` (a matrix would suffix it
  # with the language).
  code-ql:
    name: code-ql
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout guard-core-jvm engine (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/guard-core-jvm
          ref: ${{ env.GUARD_CORE_JVM_REF }}
          path: guard-core-jvm
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: kotlin,actions

      - name: Autobuild
        uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
